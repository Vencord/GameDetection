name: Publish

on:
    push:
        tags:
            - "*"

permissions:
    contents: read

jobs:
    build:
        strategy:
            matrix:
                include:
                    # Oldest supported Ubuntu, as the binary only runs on the glibc it was built against or newer
                    - { runner: ubuntu-22.04, target: linux-x64 }
                    - { runner: ubuntu-22.04-arm, target: linux-arm64 }
                    - { runner: windows-2025, target: win32-x64 }
                    - { runner: windows-11-arm, target: win32-arm64 }
                    - { runner: macos-26-intel, target: darwin-x64 }
                    - { runner: macos-26, target: darwin-arm64 }

        runs-on: ${{ matrix.runner }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm build

            - name: Check that the addon loads
              run: node -e "const a = require('./build/Release/rpc_native.node'); a.setDetectableDatabase([]); a.getRunningGames().then(console.log)"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ matrix.target }}
                  path: build/Release/rpc_native.node
                  if-no-files-found: error

    publish:
        needs: build
        runs-on: ubuntu-24.04

        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            # Creates prebuilds/<target>/rpc_native.node for every target
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: prebuilds

            # The checkout is a detached HEAD, which fails pnpm's branch check
            - run: pnpm stage publish --provenance --no-git-checks
